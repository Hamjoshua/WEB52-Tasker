<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Tasker</title>
    <link rel="stylesheet" href="../styles/reset.css">
    <link rel="stylesheet" href="../styles/base.css">
</head>

<body>    
    <a
        href="https://www.figma.com/design/U09ssoBkhIpaSLmO5v0AQ7/To-Do-List-(Community)?node-id=0-1&node-type=CANVAS&t=eVBh72HtdKbEZRmj-0">example</a>
    <div class="tool-panel">
        <div class="tool-panel-inputs">
            <input type="text" placeholder="Title..." id="titleField">
            <textarea placeholder="About..." id="aboutField"></textarea>
        </div>
        <button class="btn-add icon-add" onclick="addTask()"></button>
    </div>
    <div class="task-container">
        <div class="no-tasks">
            <hr>
            No tasks
            <hr>
        </div>
        <div class="card-with-actions" id="task1">
            <div class="card">
                <span class="task-title">Task Title...</span>
                <span class="task-about">Task body about this task...</span>
                <button class="btn-delete icon-delete"></button>
            </div>
            <div class="actions hidden">
                <button class="btn-icon icon-share"></button>
                <button class="btn-icon icon-info"></button>
                <button class="btn-icon icon-edit"></button>
            </div>
        </div>
        <div class="card-with-actions" id="task2">
            <div class="card">
                <span class="task-title">Task Title...</span>
                <span class="task-about">Task body about this task...</span>
                <button class="btn-delete icon-delete"></button>
            </div>
            <div class="actions showed">
                <button class="btn-icon icon-share"></button>
                <button class="btn-icon icon-info"></button>
                <button class="btn-icon icon-edit"></button>
            </div>
        </div>
    </div>

</body>
