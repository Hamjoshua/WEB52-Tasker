    <meta charset="utf-8">
    <title>Tasker</title>

<body>
    <a class="example-link"

    <div class="tool-panel">
        <div class="tool-panel-inputs">
            <input type="text" required placeholder="Title..." id="titleField">
            <textarea placeholder="About..." required id="aboutField"></textarea>
        </div>
        <button class="btn-add icon-add"></button>
    </div>
    <div class="no-tasks">
        <hr>
        No tasks
        <hr>
    </div>
    <div class="task-container">

    </div>
